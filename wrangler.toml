# wrangler.toml
# ============================================================
# Usage:
#   npx wrangler login
#   npx wrangler d1 create server-approval
#   npx wrangler deploy
# ============================================================

name = "server-approval"
main = "src/index.js"
compatibility_date = "2026-09-23"

[[d1_databases]]
binding = "DB"
database_name = "server-approval"
database_id = "YOUR_DATABASE_ID"
